# `workflow:` answers one question: is there anything to test at all. Which
# jobs are worth running is each job's own business, through its own `rules:`.
#
# `compare_to` is what makes `changes:` mean something stable. Without it the
# comparison is against the branch's previous push, so amending a commit
# message — an identical tree — matches nothing, creates no pipeline, and a
# merge request that requires one waits for ever. The path list here only keeps
# a branch that touches nothing from producing a pipeline in which no job
# qualifies, which fails as "No jobs to run".
#
# Every job is interruptible, so pushing again to a branch cancels the run it
# supersedes. The project's "auto-cancel redundant pipelines" only reaps jobs
# still pending: a running one is cancelled only when marked here.
default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    # The default branch compares against itself and would match nothing, so it
    # is named before the rule that compares.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/main
        paths:
          - .config/**/*
          - .gitlab-ci.yml
          - .markdownlint.yaml
          - "**/*.md"
          - defaults/**/*
          - filter_plugins/**/*
          - handlers/**/*
          - meta/**/*
          - molecule/**/*
          - scripts/**/*
          - tasks/**/*
          - templates/**/*
          - vars/**/*

# Run when the listed paths changed against the default branch, and
# unconditionally on the default branch itself and on tags — where comparing
# main to main would match nothing and skip the whole pipeline.
.on-default-branch: &on-default-branch
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# No molecule job: every scenario boots libvirt VMs from a cloud image, which
# shared runners cannot provide. The scenarios run on a workstation, and
# CONTRIBUTING.md says what that leaves uncovered.
#
# Every YAML the role is made of. `templates/` is absent on purpose:
# ansible-lint does not read `.j2` files, which is what the j2lint job is for.
ansible-lint:
  image: gwerlas/ansible-lint
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - .config/**/*
          - .gitlab-ci.yml
          - defaults/**/*
          - handlers/**/*
          - meta/**/*
          - molecule/**/*
          - tasks/**/*
          - vars/**/*
  script: ansible-lint

# ansible-lint never reads .j2 files, so a template broken at the syntax level
# would otherwise ship through a green pipeline. j2lint publishes no image,
# hence the install here; `changes` keeps that cost on the pipelines that touch
# a template.
#
# Two rules are ignored wholesale. jinja-statements-indentation expects nested
# `{% %}` to be indented, which reshapes every config template for no gain here.
# jinja-statements-delimiter forbids the `{%-` / `-%}` whitespace control these
# templates are built on: a config file is line-oriented, and a block that
# leaves its own newline behind renders a blank line the file cannot carry.
j2lint:
  image: python:3.13-slim
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - .gitlab-ci.yml
          - templates/**/*.j2
  before_script:
    - pip install --quiet j2lint==1.3.0
  script:
    - j2lint templates/ --ignore jinja-statements-indentation jinja-statements-delimiter

# Upstream's own image, whose entrypoint is the linter itself — GitLab needs a
# shell as PID 1, hence the empty entrypoint. The rules the role follows live in
# .markdownlint.yaml, so `markdownlint-cli2` needs no flag here.
markdownlint:
  image:
    name: davidanson/markdownlint-cli2:v0.23.2
    entrypoint: [""]
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.md"
          - .gitlab-ci.yml
          - .markdownlint.yaml
  script:
    - markdownlint-cli2 "**/*.md"

import:
  stage: deploy
  image: gwerlas/ansible
  # Publishing must not be cancelled halfway through.
  interruptible: false
  script: ansible-galaxy role import --token $GALAXY_TOKEN Gwerlas podman
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
