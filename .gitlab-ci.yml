# `workflow:` answers one question: is there anything to test at all. Which
# jobs are worth running is each job's own business, through its own `rules:`.
#
# `compare_to` is what makes `changes:` mean something stable. Without it the
# comparison is against the branch's previous push, so amending a commit
# message — an identical tree — matches nothing, creates no pipeline, and a
# merge request that requires one waits for ever. The path list here only keeps
# a branch that touches nothing from producing a pipeline in which no job
# qualifies, which fails as "No jobs to run".
#
# Every job is interruptible, so pushing again to a branch cancels the run it
# supersedes. The project's "auto-cancel redundant pipelines" only reaps jobs
# still pending: a running one is cancelled only when marked here.
default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    # The default branch compares against itself and would match nothing, so it
    # is named before the rule that compares.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/main
        paths:
          - .config/**/*
          - .gitlab-ci.yml
          - "**/*.md"
          - defaults/**/*
          - filter_plugins/**/*
          - handlers/**/*
          - meta/**/*
          - molecule/**/*
          - scripts/**/*
          - tasks/**/*
          - templates/**/*
          - vars/**/*

# Run when the listed paths changed against the default branch, and
# unconditionally on the default branch itself and on tags — where comparing
# main to main would match nothing and skip the whole pipeline.
.on-default-branch: &on-default-branch
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# No molecule job: every scenario boots libvirt VMs from a cloud image, which
# shared runners cannot provide. The scenarios run on a workstation, and
# CONTRIBUTING.md says what that leaves uncovered.
#
# Every YAML the role is made of. `templates/` is absent on purpose:
# ansible-lint does not read `.j2` files, so nothing here covers them.
ansible-lint:
  image: gwerlas/ansible-lint
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - .config/**/*
          - .gitlab-ci.yml
          - defaults/**/*
          - handlers/**/*
          - meta/**/*
          - molecule/**/*
          - tasks/**/*
          - vars/**/*
  script: ansible-lint

import:
  stage: deploy
  image: gwerlas/ansible
  # Publishing must not be cancelled halfway through.
  interruptible: false
  script: ansible-galaxy role import --token $GALAXY_TOKEN Gwerlas podman
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
