---
packages:
  compose:
    - app-containers/podman-compose
  docker: []
  podman:
    - app-containers/buildah
    - app-containers/podman
  rootless:
    - sys-apps/acl
  selinux:
    - sys-apps/policycoreutils

_podman_registries_defaults:
  unqualified-search-registries:
    - docker.io

_podman_containers_defaults:
  network:
    firewall_driver: nftables

# What the distribution's storage.conf sets, carried over when the role writes
# its own (see templates/storage.conf.j2). Stable Gentoo's podman 5 takes the
# file from containers-storage, which sets the driver and both roots. The testing
# branch's podman 6 takes it from container-libs, which sets the mount option
# alone : podman 6 applies a graphroot to rootless users too, and reads the
# driver's options without a driver.
_podman_storage_base_podman5:
  storage:
    driver: overlay
    runroot: /run/containers/storage
    graphroot: /var/lib/containers/storage
    options:
      overlay:
        mountopt: nodev

_podman_storage_base_podman6:
  storage:
    options:
      overlay:
        mountopt: nodev

_podman_storage_base: >-
  {{
    _podman_storage_base_podman6
    if _podman_expected_version is version('6', '>=')
    else _podman_storage_base_podman5
  }}
