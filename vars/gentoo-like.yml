---
packages:
  compose:
    - app-containers/podman-compose
  docker: []
  podman:
    - app-containers/buildah
    - app-containers/podman
  rootless:
    - sys-apps/acl
  selinux:
    - sys-apps/policycoreutils

default_registries_config:
  unqualified-search-registries:
    - docker.io

default_containers_config:
  network:
    firewall_driver: nftables
