---
packages:
  compose:
    - podman-compose
  docker:
    - podman-docker
  podman:
    - podman
  # Not something Podman needs : the role reaches a container's owner through
  # become_user, and Ansible hands its temporary files over with setfacl —
  # "you should be able to use ... POSIX.1e filesystem acls".
  # https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_privilege_escalation.html#risks-of-becoming-an-unprivileged-user
  rootless:
    - acl
  # semanage, for the file context rule a store kept off its default path needs.
  # Declared only by the distributions that ship SELinux, and named as each
  # packages it.
  selinux: []

packages_computed: |
  {{
    packages.podman +
    ((podman_users | length > 0 and 'rootless' in packages) | ternary(packages.rootless, [])) +
    ((podman_labels_store | default(false) | bool and 'selinux' in packages)
     | ternary(packages.selinux, [])) +
    ((podman_compose_install and 'compose' in packages) | ternary(packages.compose, [])) +
    ((podman_mimic_docker and 'docker' in packages) | ternary(packages.docker, [])) +
    ((podman_toolbox_install and 'toolbox' in packages) | ternary(packages.toolbox, [])) |
    flatten
  }}

# podman_containers, with the two keys the filters below read always present :
# selectattr and rejectattr raise on a container missing one, where a user
# names run_as and enabled only when they differ from the default. A container
# without run_as runs as the user the play runs as.
_podman_containers: >-
  {{
    [{'run_as': ansible_facts.user_id, 'enabled': true}] |
    product(podman_containers) |
    map('combine') |
    list
  }}
