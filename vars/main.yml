---
packages:
  compose:
    - podman-compose
  docker:
    - podman-docker
  podman:
    - podman
  # Not something Podman needs : the role reaches a container's owner through
  # become_user, and Ansible hands its temporary files over with setfacl —
  # "you should be able to use ... POSIX.1e filesystem acls".
  # https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_privilege_escalation.html#risks-of-becoming-an-unprivileged-user
  rootless:
    - acl
  # semanage, for the file context rule a store kept off its default path needs.
  # Declared only by the distributions that ship SELinux, and named as each
  # packages it.
  selinux: []

packages_computed: |
  {{
    packages.podman +
    ((podman_users | length > 0 and 'rootless' in packages) | ternary(packages.rootless, [])) +
    ((podman_labels_store | default(false) | bool and 'selinux' in packages)
     | ternary(packages.selinux, [])) +
    ((podman_compose_install and 'compose' in packages) | ternary(packages.compose, [])) +
    ((podman_mimic_docker and 'docker' in packages) | ternary(packages.docker, [])) +
    ((podman_toolbox_install and 'toolbox' in packages) | ternary(packages.toolbox, [])) |
    flatten
  }}

# The keys of a podman_containers entry that the role reads itself rather than
# handing them to podman_container, with their defaults. A container without
# run_as runs as the user the play runs as. `state` is the module's own word,
# but the role decides which state each kind of unit hands it.
_podman_containers_own_keys:
  run_as: "{{ ansible_facts.user_id }}"
  enabled: true
  state: started

# podman_containers, with the role's own keys always present : selectattr and
# rejectattr raise on a container missing one, where a user names them only
# when they differ from the default.
_podman_containers: >-
  {{
    [_podman_containers_own_keys] |
    product(podman_containers) |
    map('combine') |
    list
  }}

# Podman 4.4 : "Introduce Quadlet, a new systemd-generator that easily writes
# and maintains systemd services using Podman."
# https://github.com/containers/podman/releases/tag/v4.4.0
# Below it, or without systemd to run the generator, the units come from
# `podman generate systemd`. podman_version is null until packages.yml has
# installed podman.
_podman_quadlet: >-
  {{
    ansible_facts.service_mgr == 'systemd' and
    (podman_version | default('0', true)) is version('4.4', '>=')
  }}

# The units of the container in `_podman_container`, the loop variable of
# tasks/provision/containers/. podman generate systemd names its unit
# <prefix><separator><name>, `-` unless told otherwise ; Quadlet names it after
# the file, <name>.container unless quadlet_filename says otherwise.
_podman_generated_unit: >-
  {{ _podman_container.generate_systemd.container_prefix | default('container') }}{{
  _podman_container.generate_systemd.separator | default('-') }}{{ _podman_container.name }}
_podman_generated_unit_dir: >-
  {{
    _podman_container.generate_systemd.path |
    default(
      (_podman_container.run_as == 'root') |
      ternary(
        '/etc/systemd/system/',
        ansible_facts.getent_passwd[_podman_container.run_as].4 + '/.config/systemd/user/'
      )
    )
  }}
_podman_quadlet_unit: >-
  {{ _podman_container.quadlet_filename | default(_podman_container.name) | regex_replace('\.container$', '') }}
_podman_quadlet_file: >-
  {{
    [
      _podman_container.quadlet_dir |
      default(
        (_podman_container.run_as == 'root') |
        ternary(
          '/etc/containers/systemd',
          ansible_facts.getent_passwd[_podman_container.run_as].4 + '/.config/containers/systemd'
        )
      ),
      _podman_quadlet_unit + '.container',
    ] | path_join
  }}
