---
packages:
  compose:
    - podman-compose
  docker:
    - podman-docker
  podman:
    - buildah
    - fuse-overlayfs
    - netavark
    - passt
    - podman
    - uidmap
  toolbox:
    - podman-toolbox
  rootless:
    - acl

# Debian 12 and Ubuntu ship no storage.conf : podman runs on its built-in
# values. Once the role writes the file, podman below 6 no longer falls back on
# them — "runroot must be set". The base holds podman's own paths, which Debian
# 13 sets in its file too. No driver : the packages start podman before the
# role writes the file, and the store records the driver it was created with —
# none — then refuses any other (#31). Podman only warns that none is set.
_podman_storage_base:
  storage:
    runroot: /run/containers/storage
    graphroot: /var/lib/containers/storage
