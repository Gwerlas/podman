---
packages:
  compose:
    - podman-compose
  docker:
    - podman-docker
  podman:
    - buildah
    - fuse-overlayfs
    - netavark
    - passt
    - podman
    - uidmap
  toolbox:
    - podman-toolbox
  rootless:
    - acl

# Debian 12 and Ubuntu ship no storage.conf : podman runs on its built-in
# values. Once the role writes the file, podman below 6 no longer falls back on
# them — "runroot must be set" — and ignores the driver's options unless the
# file names the driver. The base holds podman's own values. Debian 13 carries
# over its own file instead (vars/debian13.yml).
_podman_storage_base:
  storage:
    driver: overlay
    runroot: /run/containers/storage
    graphroot: /var/lib/containers/storage
