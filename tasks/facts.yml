---
- name: Facts - Local variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ vars_file }}"
        - empty.yml
      paths:
        - "{{ role_path }}/vars"
  loop:
    - "{{ ansible_facts.os_family | lower }}-like.yml"                                          # debian-like,  redhat-like, etc.
    - "{{ ansible_facts.os_family | lower }}{{ ansible_facts.distribution_major_version }}-like.yml"  # redhat7-like
    - "{{ ansible_facts.distribution | lower }}{{ ansible_facts.distribution_major_version }}.yml"    # debian11
    - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_release | lower }}.yml" # ubuntu-jammy
  loop_control:
    loop_var: vars_file

# Only the container store needs a context from us : podman labels the layers
# container_file_t itself, and asks of its graphroot only that it not be
# default_t, where a container cannot map its own libc. Which directory that is
# depends on the host, so the task asks podman rather than guessing.
- name: Facts - SELinux is enforced
  ansible.builtin.set_fact:
    podman_labels_store: >-
      {{
        ansible_facts.selinux.status | default('disabled') == 'enabled'
        and podman_users | length > 0
      }}

# Not `result` : packages.yml imports this file under `when: result.changed`,
# and a probe registered under that name would turn the condition false for
# every task after it -- the fact below included.
#
# Not podman_system_info either : `podman system info` opens the store, and the
# database it creates then pins the graph driver, before config.yml has written
# the storage.conf naming it. `--version` is the one read that opens nothing.
- name: Get the version of podman
  ansible.builtin.command:
    cmd: podman --version
  changed_when: false
  check_mode: false
  failed_when: false
  register: podman_version_probe

# Portage installs what the tree resolves to, which depends on the keywords the
# host accepts : the stable branch carries podman 5 and the testing one podman 6.
# `emerge --pretend` resolves like the install does, where `portageq
# best_visible` reads the package alone and ignores its masked dependencies.
- name: Get the version Portage would install
  when:
    - ansible_facts.pkg_mgr == "portage"
    - podman_version_probe.rc != 0
  become: true
  ansible.builtin.command:
    cmd: emerge --pretend --noreplace --nospinner --color n app-containers/podman
  changed_when: false
  check_mode: false
  failed_when: false
  register: podman_portage_probe

# One task, so a fact cannot read another of them : the expected version comes
# from the probes, not from podman_version. podman_labels_store stays a task of
# its own above, because podman_packages reads it through packages_computed.
- name: Facts - Global
  vars:
    podman_installed_version: >-
      {{ (podman_version_probe.rc == 0) | ternary(podman_version_probe.stdout.split(' ')[2], None) }}
  ansible.builtin.set_fact:
    cacheable: true
    podman_version: "{{ podman_installed_version }}"
    podman_packages: "{{ packages_computed }}"
    _podman_expected_version: >-
      {{
        podman_installed_version
        if podman_installed_version is not none
        else (podman_portage_probe.stdout | default('') | regex_findall('app-containers/podman-([0-9][0-9.]*)') | first | default(''))
      }}

# Without a version the role cannot tell which of the two bases to write, and
# the wrong one breaks either rootless podman (6) or podman itself (5). The exit
# status says nothing here : the USE flags the role writes come after this probe,
# so a first run exits 1 on "USE changes are necessary" and still names the
# version, which the flags do not change.
- name: Refuse a Portage that does not resolve podman
  when:
    - ansible_facts.pkg_mgr == "portage"
    - podman_version is none
    - _podman_expected_version | length == 0
  vars:
    podman_probe_tail: >-
      {{ ((podman_portage_probe.stdout_lines + podman_portage_probe.stderr_lines) | select | list)[-10:] | join(' | ') }}
  ansible.builtin.fail:
    msg: |-
      Portage did not resolve app-containers/podman (emerge exited with {{ podman_portage_probe.rc }}), so the role cannot tell which version it will install, nor which storage.conf that version needs. Fix what emerge reports, then run the role again : {{ podman_probe_tail }}
