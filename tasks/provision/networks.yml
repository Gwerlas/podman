---
- name: Provision networks
  become: "{{ 'run_as' in _podman_network }}"
  become_user: "{{ _podman_network.run_as | default(omit) }}"
  containers.podman.podman_network:
    name: "{{ _podman_network.name }}"
    debug: "{{ _podman_network.debug | default(omit) }}"
    disable_dns: "{{ _podman_network.disable_dns | default(omit) }}"
    driver: "{{ _podman_network.driver | default(omit) }}"
    executable: "{{ _podman_network.executable | default(omit) }}"
    force: "{{ _podman_network.force | default(omit) }}"
    gateway: "{{ _podman_network.gateway | default(omit) }}"
    internal: "{{ _podman_network.internal | default(omit) }}"
    ip_range: "{{ _podman_network.ip_range | default(omit) }}"
    ipv6: "{{ _podman_network.ipv6 | default(omit) }}"
    macvlan: "{{ _podman_network.macvlan | default(omit) }}"
    opt: "{{ _podman_network.opt | default(omit) }}"
    recreate: "{{ _podman_network.recreate | default(omit) }}"
    state: "{{ _podman_network.state | default(omit) }}"
    subnet: "{{ _podman_network.subnet | default(omit) }}"
  loop: "{{ podman_networks }}"
  loop_control:
    loop_var: _podman_network
