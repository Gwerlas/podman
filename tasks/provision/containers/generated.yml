---
- name: Find the units of the containers to remove
  become: "{{ _podman_container.run_as != ansible_facts.user_id }}"
  become_user: "{{ _podman_container.run_as }}"
  ansible.builtin.stat:
    path: "{{ [_podman_generated_unit_dir, _podman_generated_unit + '.service'] | path_join }}"
  register: _podman_generated_units
  loop: "{{ _podman_containers | selectattr('state', 'eq', 'absent') }}"
  loop_control:
    loop_var: _podman_container
    label: "{{ _podman_container.name }}"

# Before the container goes : a unit left enabled and running would restart a
# container that no longer exists.
- name: Stop the containers to remove
  become: "{{ _podman_container.run_as != ansible_facts.user_id }}"
  become_user: "{{ _podman_container.run_as }}"
  vars:
    uid: "{{ ansible_facts.getent_passwd[_podman_container.run_as].1 }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ uid }}/bus"
  ansible.builtin.systemd:
    name: "{{ _podman_generated_unit }}"
    state: stopped
    enabled: false
    scope: "{{ (_podman_container.run_as == 'root') | ternary('system', 'user') }}"
  loop: &generated_units_found >-
    {{ _podman_generated_units.results | selectattr('stat.exists') | map(attribute='_podman_container') }}
  loop_control:
    loop_var: _podman_container
    label: "{{ _podman_container.name }}"

- name: Containers
  register: _podman_provisioned
  become: "{{ _podman_container.run_as != ansible_facts.user_id }}"
  become_user: "{{ _podman_container.run_as }}"
  vars:
    # The entry without the role's own keys, over the role's defaults : the
    # module refuses an option it does not know. An enabled container is only
    # created here, `Enable service` gives its unit the state the entry asks.
    entry: >-
      {{
        {
          'generate_systemd': {
            'container_prefix': 'container',
            'names': true,
            'path': _podman_generated_unit_dir,
            'restart_policy': 'on-failure',
          },
        } |
        combine(
          _podman_container | dict2items | rejectattr('key', 'in', _podman_containers_own_keys) | items2dict,
          recursive=true,
        ) |
        combine({
          'state':
            (_podman_container.state == 'absent' or not _podman_container.enabled) |
            ternary(_podman_container.state, 'created'),
        })
      }}
    # Told where the unit is, the module removes it with the container, even in
    # check mode ; a container to remove goes without it, and the next task
    # removes the unit.
    options: >-
      {{
        (_podman_container.state == 'absent') |
        ternary(entry | dict2items | rejectattr('key', 'eq', 'generate_systemd') | items2dict, entry)
      }}
  gwerlas_podman_container:
    options: "{{ options }}"
  loop: "{{ _podman_containers }}"
  loop_control:
    loop_var: _podman_container
    label: "{{ _podman_container.name }}"

- name: Remove the units of the containers to remove
  become: "{{ _podman_container.run_as != ansible_facts.user_id }}"
  become_user: "{{ _podman_container.run_as }}"
  ansible.builtin.file:
    path: "{{ [_podman_generated_unit_dir, _podman_generated_unit + '.service'] | path_join }}"
    state: absent
  register: _podman_removed
  loop: *generated_units_found
  loop_control:
    loop_var: _podman_container
    label: "{{ _podman_container.name }}"

# A daemon reload is an action, not a state : `ansible.builtin.systemd` has
# nothing to compare it against and reports `changed` every run. So it stays out
# of the task below, and happens only when a unit file was written or removed.
- name: Reload the unit files  # noqa no-handler
  when: _podman_provisioned.changed or _podman_removed.changed
  become: "{{ _podman_owner != ansible_facts.user_id }}"
  become_user: "{{ _podman_owner }}"
  vars:
    uid: "{{ ansible_facts.getent_passwd[_podman_owner].1 }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ uid }}/bus"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ (_podman_owner == 'root') | ternary('system', 'user') }}"
  loop: "{{ _podman_containers | map(attribute='run_as') | unique | list }}"
  loop_control:
    loop_var: _podman_owner

- name: Enable service
  become: "{{ _podman_container.run_as != ansible_facts.user_id }}"
  become_user: "{{ _podman_container.run_as }}"
  vars:
    uid: "{{ ansible_facts.getent_passwd[_podman_container.run_as].1 }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ uid }}/bus"
  ansible.builtin.systemd:
    name: "{{ _podman_generated_unit }}"
    state: "{{ (_podman_container.state == 'stopped') | ternary('stopped', 'started') }}"
    enabled: true
    scope: "{{ (_podman_container.run_as == 'root') | ternary('system', 'user') }}"
  loop: "{{ _podman_containers | rejectattr('enabled', 'false') | rejectattr('state', 'eq', 'absent') | list }}"
  loop_control:
    loop_var: _podman_container
    label: "{{ _podman_container.name }}"
