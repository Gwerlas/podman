---
- name: Rootless - Subids
  when:
    - _podman_user.name != 'root'
    - _podman_user.name in ansible_facts['getent_passwd'] or 'subuid_starts' in _podman_user
  vars:
    uid: "{{ ansible_facts['getent_passwd'][_podman_user.name].1 | default(_podman_user.uid) }}"
    subuid_starts: "{{ _podman_user.subuid_starts | default(uid | int | bitwise_shift_left(16)) }}"
    subuid_length: "{{ _podman_user.subuid_length | default(65536) }}"
  block:
    - name: Rootless - Set subuids
      become: true
      ansible.builtin.lineinfile:
        path: /etc/subuid
        regexp: "^{{ _podman_user.name }}:"
        line: "{{ _podman_user.name }}:{{ subuid_starts }}:{{ subuid_length }}"
        create: true
        mode: 0644
        owner: root
        group: root
      loop: "{{ podman_users }}"
      loop_control:
        loop_var: _podman_user

    - name: Rootless - Set subgids
      become: true
      vars:
        subgid_starts: "{{ _podman_user.subgid_starts | default(subuid_starts) }}"
        subgid_length: "{{ _podman_user.subgid_length | default(subuid_length) }}"
      ansible.builtin.lineinfile:
        path: /etc/subgid
        regexp: "^{{ _podman_user.name }}:"
        line: "{{ _podman_user.name }}:{{ subgid_starts }}:{{ subgid_length }}"
        create: true
        mode: 0644
        owner: root
        group: root
      loop: "{{ podman_users }}"
      loop_control:
        loop_var: _podman_user

- name: Rootless - Reset connection to take effect of subids changes
  ansible.builtin.meta: reset_connection
