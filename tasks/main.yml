---
# `always` : every tagged part of the role reads these facts, so a run limited
# to one tag must still load them.
- name: Load facts
  tags:
    - always
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/facts.yml"

# The configuration before the packages : Debian's and Ubuntu's start podman
# as they install it, and the first run creates the rootful store under
# whatever configuration exists, pinning the graph driver it finds there. It
# carries the packages tag so a run limited to that tag keeps the order.
- name: Configuration
  tags:
    - packages
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/config.yml"

- name: Packages
  tags:
    - packages
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/packages.yml"

- name: Rootless mode
  tags:
    - users
  when: podman_users | length > 0
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/rootless.yml"

- name: Services
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/services.yml"

- name: Provision the resources 
  tags:
    - provision
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/provision.yml"

- name: Wrappers
  when: podman_wrappers | length > 0
  tags:
    - wrappers
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/wrappers.yml"
