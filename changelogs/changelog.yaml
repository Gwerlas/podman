---
ancestor: null
releases:
  0.1.0:
    changes:
      minor_changes:
        - Install Podman, with the Compose and Toolbox packages on request (``podman_compose_install``,
          ``podman_toolbox_install``).
        - Make Podman a drop-in replacement for Docker with ``podman_mimic_docker``.
        - Set up Podman in rootless mode for the users of ``podman_users``.
        - Write ``/etc/containers/containers.conf``, ``registries.conf``, ``storage.conf``
          and ``libpod.conf`` from the ``podman_containers_config``, ``podman_registries_config``,
          ``podman_storage_config`` and ``podman_libpod_config`` dictionaries, and
          leave the distribution's files alone when none is set.
      release_summary: Initial version.
    release_date: '2023-02-12'
  0.10.0:
    changes:
      breaking_changes:
        - On Gentoo, stop writing a ``registries.conf`` that makes ``docker.io`` the
          search registry. Set it with ``podman_registries_config``, or let ``podman_mimic_docker``
          add it. (`#29 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/29>`__)
        - 'Pass the whole entry of ``podman_containers`` to ``containers.podman.podman_container``,
          so that every option of the installed collection works. A key the module
          does not know now fails the play, where the role ignored it; and ``module_defaults``
          set for ``containers.podman.podman_container`` no longer reach these containers:
          write the options in each entry. (`#27 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/27>`__)'
        - Render a ``podman_wrappers`` template under the variable ``_podman_wrapper``
          instead of ``wrapper``, as the role no longer lets its loop variables take
          the name of a user's. A template of your own, set with the ``template``
          key of a wrapper, that reads ``wrapper`` has to read ``_podman_wrapper``
          instead; the template the role ships is updated. (`#24 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/24>`__)
        - Require ``containers.podman`` 1.17.0 or later; install it with ``ansible-galaxy
          collection install 'containers.podman:>=1.17.0'`` before upgrading. (`#25
          <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/25>`__)
        - 'Run each ``podman_containers`` entry on a Quadlet unit, ``<name>.service``,
          wherever Podman is 4.4 or later and systemd manages the services, in place
          of the ``container-<name>.service`` that ``podman generate systemd`` wrote;
          the next run retires the generated units and removes their containers, so
          anything a container wrote outside a volume is lost: move it to a volume
          before upgrading. A unit or a check that refers to ``container-<name>``
          has to name ``<name>`` instead. Debian 11 and 12 and Ubuntu 22.04 keep the
          generated units. (`#20 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/20>`__)'
      bugfixes:
        - A dry run no longer reports a pull of a ``podman_images`` entry the host
          already holds; it still reports one the host does not hold yet. (`#55 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/55>`__)
        - 'Below Podman 4.4, honour the ``state`` of an enabled container : ``absent``
          now stops and disables its generated unit, then removes it with the container,
          where the container was kept and started again ; ``stopped`` leaves the
          unit stopped and enabled. An entry left at ``absent`` by mistake now loses
          its container. (`#52 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/52>`__)'
        - Enable the unit of a container under the ``generate_systemd`` separator
          and ``container_prefix`` it was generated with. (`#25 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/25>`__)
        - Merge the ``containers.conf``, ``storage.conf`` and ``libpod.conf`` settings
          of a user into the distribution's, instead of replacing a whole table as
          soon as the user names it. A ``null`` removes a setting. (`#16 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/16>`__)
        - On Gentoo, build ``nftables`` with its ``json`` USE flag, so that rootful
          containers on a bridge network start.
        - On Gentoo, write the ``graphroot`` and ``runroot`` of ``storage.conf`` only
          for Podman 5, so that rootless users keep their own store with Podman 6.
          (`#35 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/35>`__)
        - 'On Podman 4.4 and later, pull each container''s image before starting its
          Quadlet unit, as the user the container runs as, so that the first start
          no longer waits on the pull, which Podman bounds to five minutes inside
          systemd; ``pull: never`` still pulls nothing. (`#54 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/54>`__)'
        - Render the mirrors of a registry, instead of failing on them. (`#23 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/23>`__)
        - Run a container without ``run_as`` as the user the play runs as, with the
          systemd instance, the unit path, the privilege escalation and the check
          for a service manager that follow. (`#26 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/26>`__)
        - Start ``storage.conf`` from the paths Podman needs on the Debian family,
          so that rootful Podman starts with a user's storage options. (`#28 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/28>`__)
        - Stop setting ``packages``, ``sysctl`` and the variables the role registered
          under bare names (``result``, ``infos``, ``provisioned``) in the play, where
          they overrode a user's own; the role's internal variables now all start
          with ``_podman_``. (`#24 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/24>`__)
        - Write the configuration of Podman before installing its packages, so that
          the store the Debian and Ubuntu packages create no longer refuses the driver
          ``storage.conf`` names. (`#31 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/31>`__)
      minor_changes:
        - Carry over to ``storage.conf`` what the ``storage.conf`` of each distribution
          sets, instead of losing it as soon as a storage option is set.
        - Keep the development files out of the archive published on Ansible Galaxy.
        - Stop requiring ``jmespath`` on the controller. (`#25 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/25>`__)
      release_summary: Run containers on Quadlet units, and keep what each distribution
        configures.
    fragments:
      - 0.10.0.yml
      - configuration-before-packages.yml
      - configuration-merge.yml
      - container-options.yml
      - container-owner.yml
      - galaxy-archive.yml
      - generated-units-state.yml
      - gentoo-nftables-json.yml
      - gentoo-podman-6-store.yml
      - gentoo-registries.yml
      - image-check-mode.yml
      - quadlet-pull-first.yml
      - quadlet.yml
      - registry-mirrors.yml
      - role-variable-prefix.yml
      - storage-distribution-base.yml
      - wrapper-template-variable.yml
    release_date: '2026-11-01'
  0.10.1:
    changes:
      bugfixes:
        - The README links to the changelog, the requirements, the vars files and
          the license by their address on GitLab, so that they also work on the role's
          Ansible Galaxy page, where relative links led nowhere.
      release_summary: Fix the links of the README on the Galaxy page.
    fragments:
      - 0.10.1.yml
      - galaxy-links.yml
    release_date: '2026-11-01'
  0.2.0:
    changes:
      breaking_changes:
        - Require Ansible 2.10 or later.
      minor_changes:
        - Support Gentoo.
      release_summary: Add Gentoo support.
    release_date: '2023-04-08'
  0.3.0:
    changes:
      minor_changes:
        - Install wrappers that run a command in a container through Podman (``podman_wrappers``,
          ``podman_wrappers_path``, ``podman_wrappers_values``).
      release_summary: Add wrappers.
    release_date: '2023-07-24'
  0.3.1:
    changes:
      bugfixes:
        - Load the ``ip_tables`` kernel module persistently and, on Gentoo, build
          iptables with its ``nftables`` USE flag.
      release_summary: Fix module kernel loading.
    release_date: '2023-10-21'
  0.3.2:
    changes:
      bugfixes:
        - Retry the installation of the packages on network failures (``podman_retries``).
      release_summary: Retry packages installation on network failures.
    release_date: '2023-10-25'
  0.3.3:
    changes:
      bugfixes:
        - Migrate Podman's system right after a change of the subordinate user or
          group IDs, so that the change takes effect during the run.
      release_summary: Flush handlers on subuid modification.
    release_date: '2023-10-26'
  0.4.0:
    changes:
      breaking_changes:
        - '``podman_users`` is now a list of objects with a ``name`` and optional
          ``home``, ``uid``, ``subuid_starts``, ``subuid_length``, ``subgid_starts``
          and ``subgid_length`` keys, instead of a list of login names.'
      bugfixes:
        - Fix the management of the users of ``podman_users``, their home directory
          and their subordinate user and group ID ranges.
      minor_changes:
        - Create the users of ``podman_users`` that do not exist yet through the ``gwerlas.system``
          role, unless ``podman_create_missing_users`` is ``false``.
        - Run the rootless tasks alone with ``tasks_from rootless``.
      release_summary: Fix system users management.
    release_date: '2024-01-22'
  0.4.1:
    changes:
      bugfixes:
        - Fix the permissions of the home directory of system users.
      release_summary: Fix system users' home dir permissions.
    release_date: '2024-01-31'
  0.5.0:
    changes:
      breaking_changes:
        - The ``podman_current_version`` fact is now ``podman_version``.
      minor_changes:
        - Provide the ``podman_version`` and ``podman_packages`` facts without changing
          the node, with ``tasks_from facts``.
        - Provision networks (``podman_networks``) and containers (``podman_containers``),
          the latter as systemd services.
        - Run the provisioning alone with the ``provision`` tag.
      release_summary: Add resources provisioning.
    release_date: '2024-03-11'
  0.5.1:
    changes:
      bugfixes:
        - Run the Podman and Docker version probes in check mode too, so that ``--check``
          no longer fails on them.
      release_summary: Fix the check mode.
    release_date: '2024-12-06'
  0.5.2:
    changes:
      bugfixes:
        - Retry the download of the images on network failures.
      minor_changes:
        - Run the package installation and the user management alone with the ``packages``
          and ``users`` tags.
      release_summary: Retry images downloads on network failures.
    release_date: '2025-01-13'
  0.6.0:
    changes:
      minor_changes:
        - Log in to a registry when pulling the image of a container, with the ``username``
          and ``password`` keys of a ``podman_containers`` entry.
      release_summary: Enable podman login on image pull.
    release_date: '2025-02-11'
  0.7.0:
    changes:
      minor_changes:
        - Declare Enterprise Linux 10 and Gentoo among the supported platforms.
        - Provision images on their own with ``podman_images``.
      release_summary: Rewrite image provisioning.
    release_date: '2025-06-11'
  0.7.1:
    changes:
      bugfixes:
        - Set ``DBUS_SESSION_BUS_ADDRESS`` when managing the systemd service of a
          rootless container.
      release_summary: Set DBUS environment variable on service management.
    release_date: '2025-10-13'
  0.8.0:
    changes:
      breaking_changes:
        - Mount the Podman socket on ``/run/podman/podman.sock``, instead of ``/run/docker.sock``,
          in the containers of the wrappers that need it.
        - Stop loading the ``ip_tables`` and ``tun`` kernel modules, stop writing
          the Portage USE flags of iptables, and stop refusing to mimic Docker when
          Docker is installed.
      minor_changes:
        - On Gentoo, install ``podman-compose`` and use ``nftables`` as the default
          firewall driver.
        - Write a static header, ``Ansible managed - do not edit``, in the generated
          files, so that they no longer change from one run to the next.
      release_summary: Slim down the role and modernize facts access.
    release_date: '2026-05-21'
  0.9.0:
    changes:
      breaking_changes:
        - Stop converging ``gwerlas.system`` as a dependency of the role. (`#2 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/2>`__)
          The role still has to be installed, since it provides the user management,
          but a host that relied on this role to apply the whole system configuration
          has to converge ``gwerlas.system`` itself.
      bugfixes:
        - Install ``acl`` when ``podman_users`` names a user, so that provisioning
          for a user other than the connecting one no longer fails. (`#6 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/6>`__)
        - Label the container store of a rootless user, wherever its graphroot is,
          so that containers can reach their entrypoint on SELinux hosts. (`#11 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/11>`__)
        - Load the facts whatever tag a run is limited to, so that ``--tags wrappers``
          no longer fails. (`#22 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/22>`__)
        - Name EPEL, instead of failing on a missing package, when ``podman-compose``
          is not available on Enterprise Linux. (`#5 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/5>`__)
        - Pick the pull policy of the wrappers from the version of Podman, so that
          they run on the Podman 3.0 of Debian 11. (`#19 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/19>`__)
        - Read the ``env_patterns`` of a wrapper as regular expressions, as ``grep``
          does.
        - Reload the unit files only when a unit was written, so that a run that changes
          nothing reports no change. (`#7 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/7>`__)
        - Render ``storage.conf`` instead of failing on an undefined variable, and
          no longer write an empty ``[storage]`` table. (`#12 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/12>`__)
        - Set ``podman_version`` on the run that installs Podman. (`#21 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/21>`__)
        - Skip an option of a wrapper whose value is null, instead of emitting a bare
          flag that swallowed the next option.
      minor_changes:
        - Configure the Portage USE flags of Podman on Gentoo. (`#8 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/8>`__)
        - Create the source of a bind mount that does not exist yet when a wrapper
          runs, and give the wrapper script a shebang.
        - Refuse to mimic Docker when Docker is installed. (`#8 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/8>`__)
        - Require ``gwerlas.system`` 0.21.1. (`#1 <https://gitlab.com/yoanncolin/ansible/roles/podman/-/issues/1>`__)
        - Support Debian 13 (trixie).
      release_summary: Stop converging gwerlas.system, and make wrappers run everywhere.
    release_date: '2026-09-14'
