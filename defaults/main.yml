---
podman_compose_install: false
podman_toolbox_install: false

podman_mimic_docker: false

podman_create_missing_users: true
podman_users:
  - name: "{{ ansible_facts.user_id }}"

podman_retries: "{{ system_retries | default(3) }}"
podman_delay: "{{ system_delay | default(5) }}"

# Provisioning
podman_images: []
podman_networks: []
podman_containers: []

# Wrappers
podman_wrappers: []
podman_wrappers_path: /usr/local/bin

# bullseye's podman 3.0.1 has no `newer` policy and rejects the flag before it
# runs anything, killing the wrapper on its first call. Below 3.4, the lowest
# version we have a platform for that takes `newer` -- jammy's 3.4.4 -- the
# flag is left out and podman applies its own default, rather than guess where
# upstream drew the line. podman_version is null until packages.yml has
# installed podman and refreshed the facts, hence the guard.
podman_wrappers_values:
  pull: "{{ 'newer' if podman_version and podman_version is version('3.4', '>=') else none }}"
  rm: true
  tty: true

podman_wrappers_autofill:
  - annotation
  - authfile
  - blkio_weight
  - blkio_weight_device
  - cap_add
  - cap_drop
  - cgroup_parent
  - cgroupns
  - cgroups
  - cidfile
  - conmon_pidfile
  - cpu_period
  - cpu_rt_period
  - cpu_rt_runtime
  - cpu_shares
  - cpus
  - cpuset_cpus
  - cpuset_mems
  - device
  - device_read_bps
  - device_read_iops
  - device_write_bps
  - device_write_iops
  - dns
  - dns_option
  - dns_search
  - entrypoint
  - env
  - env_file
  - env_host
  - expose
  - gidmap
  - group_add
  - hostname
  - image_volume
  - init
  - init_path
  - interactive
  - ip
  - ipc
  - label
  - label_file
  - mac_address
  - memory
  - memory_reservation
  - memory_swap
  - memory_swappiness
  - mount
  - network
  - no_hosts
  - oom_kill_disable
  - oom_score_adj
  - pid
  - pids_limit
  - pod
  - privileged
  - publish
  - publish_all
  - pull
  - read_only
  - read_only_tmpfs
  - requires
  - rm
  - rootfs
  - sdnotify
  - secrets
