---
# Wrappers only : the scripts the role drops in podman_wrappers_path, and what
# they do on their first call. Running one means running podman, which is why
# this scenario needs real VMs like the others. Its platform list is the one
# molecule/default/molecule.yml declares.
- name: Converge
  hosts: all
  vars:
    podman_retries: 10
    podman_delay: 3
    # `name` rather than `command`, so the wrappers run the image's own entry
    # point instead of looking for a binary named after itself. One probe per
    # kind of source : the bind is deliberately absent from the guest, podman
    # would refuse to start and the wrapper has to create it on its first
    # call ; the named volume is podman's own and has to come out untouched ;
    # the variable is neither until the caller's shell expands it, and the
    # verify calls it once as each.
    podman_wrappers:
      - name: bind-source-probe
        image: docker.io/hello-world
        volume:
          - /var/tmp/wrapper-bind-source:/probe
      - name: named-volume-probe
        image: docker.io/hello-world
        # Null drops a default : this one has to come out with no pull policy
        # on every platform.
        pull: null
        volume:
          - wrapper-named-volume:/probe
      # Starts from the CONTAINER_OPTS of its caller, where every other probe
      # resets it.
      - name: extends-probe
        image: docker.io/hello-world
        can_extends: true
      - name: variable-source-probe
        image: docker.io/hello-world
        volume:
          - $WRAPPER_PROBE_SOURCE:/probe
  roles:
    - gwerlas.podman
