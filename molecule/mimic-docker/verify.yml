---
- name: Verify Docker and DockerHub immitation
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Remove short names
      become: true
      ansible.builtin.file:
        path: /etc/containers/registries.conf.d
        state: absent
  tasks:
    - name: Hello world
      ansible.builtin.command:
        cmd: docker run hello-world
      changed_when: false
      register: docker_run
      failed_when:
        - docker_run.rc > 0
        - not "'Hello from Docker!' in docker_run.stdout"

    - name: Ask podman its version
      containers.podman.podman_system_info:
      register: podman_info

    # The drop-ins are gone (see pre_tasks), so the search list is the role's
    # file alone : docker.io comes from podman_mimic_docker, on Gentoo as
    # anywhere.
    - name: Check docker.io is a search registry
      ansible.builtin.assert:
        that:
          - "'docker.io' in podman_info.podman_system_info.registries.search"
        fail_msg: "registries : {{ podman_info.podman_system_info.registries }}"

    # `docker compose` is delegated to podman-compose by podman itself, but only
    # since Podman 4.7. Older distributions just have no compose at all.
    - name: Compose through the docker command
      when: podman_info.podman_system_info.version.Version is version('4.7', '>=')
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false
