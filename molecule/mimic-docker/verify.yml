---
- name: Verify Docker and DockerHub immitation
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Remove short names
      become: true
      ansible.builtin.file:
        path: /etc/containers/registries.conf.d
        state: absent
  tasks:
    - name: Hello world
      ansible.builtin.command:
        cmd: docker run hello-world
      changed_when: false
      register: docker_run
      failed_when:
        - docker_run.rc > 0
        - not "'Hello from Docker!' in docker_run.stdout"

    - name: Get the version of podman
      ansible.builtin.command:
        cmd: podman --version
      changed_when: false
      register: podman_version

    # `docker compose` is delegated to podman-compose by podman itself, but only
    # since Podman 4.7. Older distributions just have no compose at all.
    - name: Compose through the docker command
      when: podman_version.stdout.split() | last is version('4.7', '>=')
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false
