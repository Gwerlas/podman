---
- name: Verify role without any options
  hosts: all
  gather_facts: false
  tasks:
    - name: Hello world
      containers.podman.podman_container:
        name: test
        image: docker.io/library/hello-world
        detach: false

    # A published port has netavark write firewall rules, through the driver
    # the distribution defaults pick.
    - name: Hello world as root, on a published port
      become: true
      containers.podman.podman_container:
        name: test-rootful
        image: docker.io/library/hello-world
        detach: false
        publish:
          - 8080:80
