---
dependency:
  name: galaxy
  # ansible-galaxy refuses to write over a role directory that already exists,
  # and gives up rather than replacing it — so a version bump in
  # requirements.yml stops the run until someone deletes the cached copy.
  options:
    force: true
driver:
  name: default
# Every platform of molecule/shared/platforms.yml. The `service` scenario links
# to this file rather than repeating the list : both boot the whole matrix, and
# only their converge differs.
platforms:
  - name: archlinux
    groups:
      - archlinux
    memory: 2
  - name: bullseye
    groups:
      - debian_like
      - debian
    memory: 2
  - name: bookworm
    groups:
      - debian_like
      - debian
    memory: 2
  - name: trixie
    groups:
      - debian_like
      - debian
    memory: 2
  - name: jammy
    groups:
      - debian_like
      - ubuntu
    memory: 2
  - name: noble
    groups:
      - debian_like
      - ubuntu
    memory: 2
  - name: centos9s
    groups:
      - redhat_like
    memory: 2
  - name: alma9
    groups:
      - redhat_like
    memory: 2
  - name: centos10s
    groups:
      - redhat_like
    memory: 2
  - name: alma10
    groups:
      - redhat_like
    memory: 2
  - name: fedora43
    groups:
      - redhat_like
    memory: 2
  - name: fedora44
    groups:
      - redhat_like
    memory: 2
  # Gentoo builds Podman from source: the official binhost is built against an
  # OpenRC profile, and the role drives USE flags anyway, so no binary package
  # matches. Give it cores to keep the emerge short.
  - name: gentoo
    groups:
      - gentoo
    memory: 4
    vcpus: 4
provisioner:
  name: ansible
  playbooks:
    create: ../shared/create.yml
    destroy: ../shared/destroy.yml
    prepare: ../shared/prepare.yml
verifier:
  name: ansible
