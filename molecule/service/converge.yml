---
# Provisioning users, images and containers, including the rootless systemd
# units — which is why this scenario needs real VMs. Its platform list is the
# one molecule/default/molecule.yml declares.
- name: Converge
  hosts: all
  vars:
    # Nothing else renders storage.conf, and a template no scenario reaches is
    # a template that breaks unnoticed. A key no distribution ships : what
    # they ship has to show beside it, not under it.
    podman_storage_config:
      storage:
        options:
          overlay:
            skip_mount_home: "true"
    # bullseye's vars file sets containers.log_driver and engine.cgroup_manager :
    # one table takes a key next to the distribution's, the other loses the key
    # set to null.
    podman_containers_config:
      containers:
        log_driver: null
      engine:
        events_logger: file
    # mirror.gcr.io serves Docker Hub's library images, which is all the
    # containers below pull.
    podman_registries_config:
      registry:
        - location: docker.io
          mirror:
            - location: mirror.gcr.io
    podman_retries: 10
    podman_delay: 3
    podman_users:
      # The user the play runs as, which owns the container without run_as.
      - name: "{{ ansible_facts.user_id }}"
      - name: myapp
      - name: nginx
        home: /data/web
        create_home: false
        password_lock: true
        shell: /usr/bin/nologin
        system: true
        uid: 300
    podman_images:
      - name: docker.io/nginx:latest
        owner: nginx
    podman_containers:
      # No `enabled` key : its absence has to read as enabled, which the unit
      # answering on 8080 after a reboot is what proves.
      - run_as: nginx
        name: nginx
        image: docker.io/nginx:latest
        publish:
          - 8080:80
      # `enabled: false` : podman starts this one itself, and its unit is
      # written but never enabled, so 8081 answers before the reboot and
      # nothing answers after it.
      - run_as: nginx
        name: idle
        image: docker.io/nginx:latest
        enabled: false
        publish:
          - 8081:80
      # A unit named `app_named` rather than `container-named` : the service
      # to enable has to be looked up under the prefix and separator podman
      # was given, or 8082 stays silent after the reboot.
      - run_as: nginx
        name: named
        image: docker.io/nginx:latest
        generate_systemd:
          container_prefix: app
          separator: _
        publish:
          - 8082:80
      # No `run_as` : it runs as the user the play runs as, and its unit goes
      # to that user's instance. That user does not linger, so 8083 is only
      # checked before the reboot, next to the unit being enabled. `umask` is
      # an option the role does not name anywhere : it reaches the container
      # only if the whole entry reaches the module.
      - name: mine
        image: docker.io/nginx:latest
        umask: "0077"
        publish:
          - 8083:80
      # `run_as: root` : its unit goes to the system instance, which brings
      # 8084 back after the reboot without any lingering.
      - run_as: root
        name: rootful
        image: docker.io/nginx:latest
        publish:
          - 8084:80
  roles:
    - gwerlas.podman
