---
- name: Verify that myapp user can run a container
  hosts: all
  tasks:
    # nginx keeps its home in /data/web, so its store sits off the default
    # path and gets a rule of its own. The home is not ours to label : it is a
    # service's state directory, and it must come out of a converge untouched.
    - name: Read the SELinux context of the container store
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'
      become: true
      ansible.builtin.stat:
        path: /data/web/.local/share/containers/storage
        get_selinux_context: true
      register: rootless_store

    - name: Read the SELinux context of the home
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'
      become: true
      ansible.builtin.stat:
        path: /data/web
        get_selinux_context: true
      register: rootless_home

    # selinux_context is [user, role, type, range] ; the type is what decides.
    - name: Check the store is labelled and the home is left alone
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'
      ansible.builtin.assert:
        that:
          - rootless_store.stat.selinux_context[2] == "data_home_t"
          - rootless_home.stat.selinux_context[2] == "default_t"
        fail_msg: >-
          store={{ rootless_store.stat.selinux_context | default('?') }}
          home={{ rootless_home.stat.selinux_context | default('?') }}

    # The reference the role's file has to keep : what rootful podman makes of
    # the distribution's own storage.conf, mounted over the role's in a private
    # mount namespace, so podman reads it with the drop-ins it would read beside
    # it — which CONTAINERS_STORAGE_CONF skips. The file lives under
    # /usr/share, or, on EL 9, in the .rpmnew rpm leaves next to the role's.
    # Where the distribution ships none, a tmpfs over /etc/containers leaves
    # podman its built-in values.
    - name: Look for the distribution's storage configuration
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/share/containers/storage.conf
        - /etc/containers/storage.conf.rpmnew
      register: shipped_storage

    - name: Name the distribution's storage configuration
      ansible.builtin.set_fact:
        shipped_file: >-
          {{ shipped_storage.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}

    - name: Ask rootful podman its store under the distribution's configuration
      become: true
      ansible.builtin.command:
        argv:
          - unshare
          - --mount
          - sh
          - -c
          - >-
            {{
              (shipped_file | length > 0) |
              ternary(
                'mount --bind ' ~ shipped_file ~ ' /etc/containers/storage.conf',
                'mount -t tmpfs tmpfs /etc/containers'
              )
            }}
            && exec podman info --format json
      changed_when: false
      register: shipped_info

    # #28 : a storage.conf lacking what podman needs left rootful podman
    # unable to read its own configuration.
    - name: Ask rootful podman its store
      become: true
      ansible.builtin.command:
        argv: [podman, info, --format, json]
      changed_when: false
      register: rootful_info

    - name: Check the user's option applies over the distribution's store
      vars:
        store: "{{ (rootful_info.stdout | from_json).store }}"
        shipped: "{{ (shipped_info.stdout | from_json).store }}"
        complaints: "{{ rootful_info.stderr_lines | select('search', 'storage') | list }}"
      ansible.builtin.assert:
        that:
          - store.graphOptions['overlay.skip_mount_home'] | default('') == 'true'
          - (shipped.graphOptions | dict2items) | difference(store.graphOptions | dict2items) == []
          - shipped.graphDriverName == store.graphDriverName
          - shipped.graphRoot == store.graphRoot
          - shipped.runRoot == store.runRoot
          - complaints == []
        fail_msg: >-
          store={{ store | to_json }}
          shipped={{ shipped | to_json }}
          complaints={{ complaints }}

    # Podman 6 applies a graphroot of storage.conf to rootless users too, which
    # earlier versions ignored (containers-storage.conf(5) :
    # https://github.com/containers/storage/blob/main/docs/containers-storage.conf.5.md).
    # Whatever the role writes, each mode has to keep its own store.
    - name: Ask podman the store of a rootless user
      become: true
      become_user: myapp
      containers.podman.podman_system_info:
      register: rootless_info

    - name: Check root and a rootless user each keep their own store
      vars:
        rootless_graph_root: "{{ rootless_info.podman_system_info.store.graphRoot }}"
        rootful_graph_root: "{{ (rootful_info.stdout | from_json).store.graphRoot }}"
      ansible.builtin.assert:
        that:
          - rootless_graph_root.startswith('/home/myapp/')
          - rootful_graph_root == '/var/lib/containers/storage'
        fail_msg: "rootless={{ rootless_graph_root }} rootful={{ rootful_graph_root }}"

    # podman info does not report pull_options : that table is compared in the
    # files, one `key = value` line at a time.
    - name: Read the pull options of the distribution's file and the role's
      when: shipped_file | length > 0
      become: true
      ansible.builtin.command:
        argv:
          - awk
          - >-
            /^\[/ { in_table = ($0 == "[storage.options.pull_options]") }
            in_table && /^[a-z_]+ *=/
          - "{{ item }}"
      changed_when: false
      loop:
        - "{{ shipped_file }}"
        - /etc/containers/storage.conf
      register: pull_options

    - name: Check the distribution's pull options survive
      when: shipped_file | length > 0
      vars:
        shipped: "{{ pull_options.results[0].stdout_lines }}"
        rendered: "{{ pull_options.results[1].stdout_lines }}"
      ansible.builtin.assert:
        that:
          - shipped | difference(rendered) == []
        fail_msg: "shipped={{ shipped }} rendered={{ rendered }}"

    - name: Read the rendered containers configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/containers/containers.conf
      register: containers_conf

    - name: Check the user's settings merged into the distribution's
      vars:
        lines: "{{ (containers_conf.content | b64decode).split('\n') }}"
      ansible.builtin.assert:
        that:
          - "'events_logger = \"file\"' in lines"
          - "'log_driver = \"journald\"' not in lines"
          - "inventory_hostname != 'bullseye' or 'cgroup_manager = \"cgroupfs\"' in lines"
        fail_msg: "rendered : {{ lines }}"

    - name: Ask podman the registries it read
      become: true
      containers.podman.podman_system_info:
      register: podman_info

    - name: Check the mirror reached podman
      vars:
        registries: "{{ podman_info.podman_system_info.registries }}"
      ansible.builtin.assert:
        that:
          - registries['docker.io'].Mirrors | map(attribute='Location') | list == ['mirror.gcr.io']
        fail_msg: "registries : {{ registries }}"

    - name: Hello world
      become: true
      become_user: myapp
      containers.podman.podman_container:
        name: test
        image: hello-world
        detach: false

    - name: Test HTTP server
      ansible.builtin.uri:
        url: http://localhost:8080
        method: HEAD
        use_proxy: false

    - name: Test the container left out of the units
      ansible.builtin.uri:
        url: http://localhost:8081
        method: HEAD
        use_proxy: false

    - name: Test the container of the user the play runs as
      ansible.builtin.uri:
        url: http://localhost:8083
        method: HEAD
        use_proxy: false

    - name: Read the unit of the container of the user the play runs as
      ansible.builtin.systemd:
        name: container-mine
        scope: user
      register: mine_unit

    - name: Check that unit is enabled in that user's instance
      ansible.builtin.assert:
        that:
          - mine_unit.status.UnitFileState == 'enabled'
        fail_msg: "UnitFileState={{ mine_unit.status.UnitFileState }}"

    - name: Read the container of the user the play runs as
      containers.podman.podman_container_info:
        name: mine
      register: mine_info

    - name: Check an option the role does not name reached it
      ansible.builtin.assert:
        that:
          - mine_info.containers[0].Config.Umask == '0077'
        fail_msg: "Umask={{ mine_info.containers[0].Config.Umask }}"

    - name: Reboot
      become: true
      ansible.builtin.reboot:

    - name: Test HTTP server after reboot
      ansible.builtin.uri:
        url: http://localhost:8080
        method: HEAD
        use_proxy: false

    - name: Test the container with its own unit name after reboot
      ansible.builtin.uri:
        url: http://localhost:8082
        method: HEAD
        use_proxy: false

    - name: Test the rootful container after reboot
      ansible.builtin.uri:
        url: http://localhost:8084
        method: HEAD
        use_proxy: false

    # A container declared `enabled: false` gets a unit file that is never
    # enabled, so a reboot is the end of it.
    - name: Check the disabled container did not come back
      ansible.builtin.wait_for:
        port: 8081
        state: stopped
        timeout: 30
