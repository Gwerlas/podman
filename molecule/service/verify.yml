---
- name: Verify that myapp user can run a container
  hosts: all
  tasks:
    # nginx keeps its home in /data/web, so its store sits off the default
    # path and gets a rule of its own. The home is not ours to label : it is a
    # service's state directory, and it must come out of a converge untouched.
    - name: Read the SELinux context of the container store
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'
      become: true
      ansible.builtin.stat:
        path: /data/web/.local/share/containers/storage
        get_selinux_context: true
      register: rootless_store

    - name: Read the SELinux context of the home
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'
      become: true
      ansible.builtin.stat:
        path: /data/web
        get_selinux_context: true
      register: rootless_home

    # selinux_context is [user, role, type, range] ; the type is what decides.
    - name: Check the store is labelled and the home is left alone
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'
      ansible.builtin.assert:
        that:
          - rootless_store.stat.selinux_context[2] == "data_home_t"
          - rootless_home.stat.selinux_context[2] == "default_t"
        fail_msg: >-
          store={{ rootless_store.stat.selinux_context | default('?') }}
          home={{ rootless_home.stat.selinux_context | default('?') }}

    - name: Read the rendered storage configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/containers/storage.conf
      register: storage_conf

    - name: Check the driver section landed, and no empty table with it
      vars:
        lines: "{{ (storage_conf.content | b64decode).split('\n') }}"
      ansible.builtin.assert:
        that:
          - "'[storage.options.overlay]' in lines"
          - "'mountopt = \"nodev\"' in lines"
          - "'[storage]' not in lines"
          - "'[storage.options]' not in lines"
        fail_msg: "rendered : {{ lines }}"

    - name: Read the rendered containers configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/containers/containers.conf
      register: containers_conf

    - name: Check the user's settings merged into the distribution's
      vars:
        lines: "{{ (containers_conf.content | b64decode).split('\n') }}"
      ansible.builtin.assert:
        that:
          - "'events_logger = \"file\"' in lines"
          - "'log_driver = \"journald\"' not in lines"
          - "inventory_hostname != 'bullseye' or 'cgroup_manager = \"cgroupfs\"' in lines"
        fail_msg: "rendered : {{ lines }}"

    - name: Ask podman the registries it read
      become: true
      containers.podman.podman_system_info:
      register: podman_info

    - name: Check the mirror reached podman
      vars:
        registries: "{{ podman_info.podman_system_info.registries }}"
      ansible.builtin.assert:
        that:
          - registries['docker.io'].Mirrors | map(attribute='Location') | list == ['mirror.gcr.io']
        fail_msg: "registries : {{ registries }}"

    - name: Hello world
      become: true
      become_user: myapp
      containers.podman.podman_container:
        name: test
        image: hello-world
        detach: false

    - name: Test HTTP server
      ansible.builtin.uri:
        url: http://localhost:8080
        method: HEAD
        use_proxy: false

    - name: Test the container left out of the units
      ansible.builtin.uri:
        url: http://localhost:8081
        method: HEAD
        use_proxy: false

    - name: Test the container of the user the play runs as
      ansible.builtin.uri:
        url: http://localhost:8083
        method: HEAD
        use_proxy: false

    - name: Read the unit of the container of the user the play runs as
      ansible.builtin.systemd:
        name: container-mine
        scope: user
      register: mine_unit

    - name: Check that unit is enabled in that user's instance
      ansible.builtin.assert:
        that:
          - mine_unit.status.UnitFileState == 'enabled'
        fail_msg: "UnitFileState={{ mine_unit.status.UnitFileState }}"

    - name: Read the container of the user the play runs as
      containers.podman.podman_container_info:
        name: mine
      register: mine_info

    - name: Check an option the role does not name reached it
      ansible.builtin.assert:
        that:
          - mine_info.containers[0].Config.Umask == '0077'
        fail_msg: "Umask={{ mine_info.containers[0].Config.Umask }}"

    - name: Reboot
      become: true
      ansible.builtin.reboot:

    - name: Test HTTP server after reboot
      ansible.builtin.uri:
        url: http://localhost:8080
        method: HEAD
        use_proxy: false

    - name: Test the container with its own unit name after reboot
      ansible.builtin.uri:
        url: http://localhost:8082
        method: HEAD
        use_proxy: false

    - name: Test the rootful container after reboot
      ansible.builtin.uri:
        url: http://localhost:8084
        method: HEAD
        use_proxy: false

    # A container declared `enabled: false` gets a unit file that is never
    # enabled, so a reboot is the end of it.
    - name: Check the disabled container did not come back
      ansible.builtin.wait_for:
        port: 8081
        state: stopped
        timeout: 30
